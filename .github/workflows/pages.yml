name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"] # Memicu deploy otomatis setiap ada push ke branch main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
          
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        
      - name: Lint
        run: bun run lint
        
      - name: TypeScript
        run: bunx tsc --noEmit
        
      - name: Build static portfolio
        run: bun run build
        env:
          DOMAIN: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          
      - name: Verify static export
        run: bun run check:export
        env:
          DOMAIN: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4